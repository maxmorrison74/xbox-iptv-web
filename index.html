<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Smarters Xbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            min-width: 150px;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-red { background: #dc2626; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .input-group input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
        }
        .input-group input:focus { outline: none; border-color: #667eea; }
        .login-box {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .center-vertical {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .channel-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .channel-card:hover { background: rgba(102,126,234,0.3); transform: scale(1.05); }
        .channel-icon {
            width: 100%;
            max-height: 100px;
            object-fit: contain;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .nav-bar {
            background: rgba(0,0,0,0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .info-text { color: #aaa; font-size: 14px; }
        .error-text { color: #ef4444; background: rgba(239,68,68,0.2); padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        // Log di debug
        console.log('=== APP START ===');
        console.log('URL:', window.location.href);
        console.log('User Agent:', navigator.userAgent);

        let state = {
            auth: null,
            channels: [],
            loading: true
        };

        // Carica auth salvata
        try {
            const saved = localStorage.getItem('auth');
            if (saved) {
                state.auth = JSON.parse(saved);
            }
        } catch(e) {
            console.log('Nessuna auth salvata');
        }

        // Default credentials
        if (!state.auth) {
            state.auth = {
                serverUrl: 'http://ngueyepdn.xxczsmart.com',
                username: 'M99SVERR',
                password: 'JJAJXT7V'
            };
        }

        // Init app
        console.log('State:', state);
        if (state.auth.username) {
            loadChannels();
        } else {
            showLogin();
        }

        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="center-vertical">
                    <div class="login-box">
                        <h1 style="text-align:center;margin-bottom:30px;font-size:28px;">📺 IPTV Smarters Xbox</h1>
                        <form onsubmit="handleLogin(event)">
                            <div class="input-group">
                                <label>URL Server</label>
                                <input type="text" id="server" value="${state.auth.serverUrl}" placeholder="http://server.com:8080" required>
                            </div>
                            <div class="input-group">
                                <label>Username</label>
                                <input type="text" id="username" value="${state.auth.username}" placeholder="Username" required>
                            </div>
                            <div class="input-group">
                                <label>Password</label>
                                <input type="password" id="password" value="${state.auth.password}" placeholder="Password" required>
                            </div>
                            <button type="submit" class="btn" style="width:100%">🔐 ACCEDI</button>
                        </form>
                    </div>
                </div>
            `;
            console.log('Login view rendered');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const server = document.getElementById('server').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!server || !username || !password) {
                alert('Tutti i campi sono obbligatori!');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Autenticazione...';
            btn.disabled = true;

            try {
                const url = `${server.replace(/\/$/, '')}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                console.log('Login URL:', url);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (data.user_info && data.user_info.auth === 1) {
                    state.auth = { serverUrl: server, username, password };
                    localStorage.setItem('auth', JSON.stringify(state.auth));
                    console.log('Login riuscito!');
                    loadChannels();
                } else {
                    alert('Login fallito: ' + (data.user_info?.message || 'Errore sconosciuto'));
                }
            } catch (err) {
                console.error('Errore Login:', err);
                alert('Errore di connessione: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function loadChannels() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div style="text-align:center">
                    <div class="spinner"></div>
                    <p style="color:#aaa;font-size:18px;">Caricamento canali...</p>
                </div>
            `;
            console.log('Loading channels...');

            try {
                const { serverUrl, username, password } = state.auth;
                const url = `${serverUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_live_streams`;

                console.log('Channels URL:', url);
                const response = await fetch(url);
                console.log('Channels response status:', response.status);
                const data = await response.json();
                console.log('Channels count:', data ? data.length : 0);

                state.channels = data || [];
                renderChannels();
            } catch (err) {
                console.error('Errore caricamento canali:', err);
                app.innerHTML = `
                    <div class="login-box">
                        <div class="error-text">
                            <h2>❌ Errore</h2>
                            <p>${err.message}</p>
                        </div>
                        <button class="btn" onclick="showLogin()">Torna al Login</button>
                    </div>
                `;
            }
        }

        function renderChannels() {
            const app = document.getElementById('app');
            const { username, serverUrl } = state.auth;

            app.innerHTML = `
                <div class="nav-bar">
                    <h2 style="font-size:24px;">📺 Canali Live</h2>
                    <div style="display:flex;gap:10px;align-items:center;">
                        <span class="info-text">${state.channels.length} canali • ${username}</span>
                        <button class="btn" onclick="location.reload()" style="padding:10px 15px">🔄</button>
                        <button class="btn btn-red" onclick="logout()" style="padding:10px 15px">🚪</button>
                    </div>
                </div>
                <div class="channel-grid">
                    ${state.channels.slice(0, 60).map(ch => `
                        <div class="channel-card" ondblclick="playChannel(${ch.stream_id})" style="touch-action: manipulation;">
                            ${ch.stream_icon ? `
                                <img src="${ch.stream_icon}" 
                                    class="channel-icon" 
                                    alt="${ch.name}"
                                    onerror="this.style.display='none'">
                            ` : ''}
                            <h3 style="font-size:14px;margin-bottom:10px;line-height:1.4;">${ch.name}</h3>
                            <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:#4ade80;margin-top:12px">
                                <span style="width:8px;height:8px;background:#4ade80;border-radius:50%"></span>
                                <span style="font-size:14px">LIVE</span>
                            </div>
                            <div style="font-size:12px;color:#aaa;margin-top:8px">Doppio click per aprire</div>
                        </div>
                    `).join('')}
                </div>
            `;
            console.log('Channels rendered:', state.channels.length);
        }

        function playChannel(streamId) {
            const { serverUrl, username, password } = state.auth;
            const url = `${serverUrl}/live/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${streamId}.m3u8`;
            
            console.log('Play channel:', url);
            window.open(url, '_blank');
        }

        function logout() {
            localStorage.removeItem('auth');
            state.auth = null;
            location.reload();
        }
    </script>
</body>
</html>
