name: Build Xbox IPTV Web App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dipendenze
        run: npm ci
          
      - name: Build
        run: npm run build
        
      - name: Upload artefatti
        uses: actions/upload-artifact@v4
        with:
          name: xbox-iptv-web
          path: dist/
          retention-days: 7
